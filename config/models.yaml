# Model names live here, never in code. Swap a provider by changing this file.
llm:
  # Who writes the scripts: anthropic (Claude API) or azure_openai (a model you deployed in
  # Azure AI Foundry). Switching is this one line; the matching keys go in .env.
  provider: azure_openai
  max_tokens: {topic: 3000, script: 16000, critic: 6000, package: 4000, shorts: 6000}
  anthropic:
    strong: claude-sonnet-5-5     # script + critic
    small: claude-haiku-5-5       # topic + package
  azure_openai:
    # Your Foundry *deployment names* (Foundry suggests the model name; keep it).
    # gpt-5-mini does both jobs: the Azure for Students subscription has quota for it
    # (500K tokens per minute) but none for gpt-5-nano. Its deployment needs at least 50K TPM.
    # A stronger writer: deploy gpt-5 in Foundry and set strong: gpt-5 (about $1 a video instead of $0.20).
    strong: gpt-5-mini
    small: gpt-5-mini
    # GPT-5-family models reason before answering; delete these lines for models that don't
    # (gpt-4.1, DeepSeek-V3, Llama), or the request is rejected. The story is the hard part: at "low"
    # gpt-5-mini writes a lecture and ignores the critic's fixes, so the script thinks hard and the rest
    # stays cheap (a whole episode is still a few US cents on gpt-5-mini).
    reasoning_effort: {script: high, critic: medium, shorts: medium, default: low}
    # Reasoning tokens count toward the limit, so allow more than Claude needs.
    max_tokens: {script: 64000, critic: 16000, topic: 6000, package: 6000, shorts: 16000}
tts:
  provider: azure               # azure | elevenlabs (most human) | openai | kokoro (free, local) | fake
image:
  provider: openai              # openai | fake
  model: gpt-image-1            # VERIFY the current image model name before the first run
  quality: medium
