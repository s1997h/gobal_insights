name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest -q   # fakes only: no keys, no cost; the real render test is skipped

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: render/package-lock.json}
      - run: npm ci
        working-directory: render
      - run: npx tsc --noEmit
        working-directory: render

  # Builds the image so a broken Dockerfile is caught early. Pushing to Azure Container Registry comes later.
  docker:
    runs-on: ubuntu-latest
    needs: [python, render]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile -t videopipe:ci .
      - run: docker run --rm videopipe:ci doctor || true
