name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest -q   # fakes only: no keys, no cost; the real render test is skipped

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: "22", cache: npm, cache-dependency-path: render/package-lock.json}
      - run: npm ci
        working-directory: render
      - run: npx tsc --noEmit
        working-directory: render

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -x -P SCRIPTDIR -s bash infra/azure/*.sh infra/entrypoint.sh

  docker:
    runs-on: ubuntu-latest
    needs: [python, render]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f infra/Dockerfile -t videopipe:ci .
      - run: docker run --rm videopipe:ci doctor || true
      # On pull requests, prove the image can render: a free offline video, the same way the Azure job runs it.
      - name: Smoke test render
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p work && chmod 777 work
          docker run --rm -e WORK_DIR=/work -v "$PWD/work:/work" videopipe:ci run --channel whatif --offline --quick
          find work/out -name video.mp4 | grep .
      # The cartoon-episode command, end to end: script stand-in, real render, one Short, thumbnail.
      - name: Smoke test episode
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -e WORK_DIR=/work -v "$PWD/work:/work" videopipe:ci episode --channel iflab --offline --quick --shorts 1
          find work/out/iflab -name short1.mp4 | grep .
          find work/out/iflab -name thumbnail.png | grep .
